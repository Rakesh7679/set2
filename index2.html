
<!DOCTYPE html>
<html>
<head>
    <title>String Pattern Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            margin: 8px 0;
            font-size: 16px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        pre {
            background: #eeeeee;
            padding: 12px;
            white-space: pre-wrap;
            font-family: monospace;
        }

        h2 {
            color: #007bff;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>String Pattern Generator</h1>

    <label>Enter a string (3-10 alphabets):</label><br>

    <input type="text" id="inputString"
           placeholder="Enter string">

    <button onclick="processString()">Generate</button>

    <div id="output"></div>
</div>

<script>
function processString() {

    // Step 1: Take and validate input
    let str = document.getElementById("inputString").value.trim();

    if (!/^[a-zA-Z]{3,10}$/.test(str)) {
        alert("Enter only alphabets, length 3 to 10!");
        return;
    }

    // Step 2: Convert to uppercase
    let upper = str.toUpperCase();

    // Step 3: Count vowels and consonants
    let vowels = 0;
    let consonants = 0;

    for (let ch of upper) {
        if ("AEIOU".includes(ch)) {
            vowels++;
        } else {
            consonants++;
        }
    }

    // Step 4: Reverse Alphabet Ladder
    let pattern1 = "";

    for (let i = upper.length; i >= 1; i--) {
        for (let j = i; j >= 1; j--) {
            pattern1 += String.fromCharCode(64 + j) + " ";
        }
        pattern1 += "\n";
    }

    // Step 5: Hollow Square
    let size = vowels + 3;
    let pattern2 = "";

    for (let i = 1; i <= size; i++) {
        for (let j = 1; j <= size; j++) {
            if (i === 1 || i === size ||
                j === 1 || j === size) {
                pattern2 += "* ";
            } else {
                pattern2 += "  ";
            }
        }
        pattern2 += "\n";
    }

    // Step 6: Check vowel or consonant dominance
    let result = "";

    if (vowels > consonants) {
        result = "VOWEL DOMINANT";
    } else {
        result = "CONSONANT DOMINANT";
    }

    // Display all results
    document.getElementById("output").innerHTML =
        "<h2>Uppercase String</h2>" +
        "<p>" + upper + "</p>" +

        "<h2>Vowel Count</h2>" +
        "<p>" + vowels + "</p>" +

        "<h2>Consonant Count</h2>" +
        "<p>" + consonants + "</p>" +

        "<h2>Pattern 1: Reverse Alphabet Ladder</h2>" +
        "<pre>" + pattern1 + "</pre>" +

        "<h2>Pattern 2: Hollow Square</h2>" +
        "<pre>" + pattern2 + "</pre>" +

        "<h2>Final Result</h2>" +
        "<p>" + result + "</p>";
}
</script>

</body>
</html>
